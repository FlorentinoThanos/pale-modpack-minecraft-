#Radius of the innermost cylinder, in blocks. Going past it switches on the Pale camera fog.
# Default: 1400.0
# Range: 1.0 ~ 3.0E7
innerRadius = 1400.0
#Radius of the outermost cylinder, in blocks. The camera fog and the ash are at their thickest from here on.
#Treated as innerRadius + 1 if set lower than that.
# Default: 2000.0
# Range: 1.0 ~ 3.0E7
outerRadius = 2000.0
#Number of cylinders, spaced evenly from innerRadius to outerRadius.
# Default: 20
# Range: 1 ~ 64
layerCount = 20
#Dimensions the wall and its fog appear in.
dimensions = ["minecraft:overworld"]
#How far you can see just inside innerRadius, in blocks (about what the Basalt Deltas give you).
#The fog closes in to this over the last 120 blocks before innerRadius.
# Default: 96.0
# Range: 2.0 ~ 1024.0
fogEntryVisibility = 96.0
#How far you can see at outerRadius and beyond, in blocks. In between the fog keeps getting thicker.
# Default: 6.0
# Range: 1.0 ~ 1024.0
fogFullVisibility = 6.0
