[world]
	#Radius up to which terrain is untouched. From here land sinks into the ocean.
	# Default: 1050.0
	# Range: 0.0 ~ 3.0E7
	landFalloffStartRadius = 1050.0
	#Radius where land ends. Past it there is only ocean. Treated as landFalloffStartRadius + 1 if lower.
	# Default: 1250.0
	# Range: 0.0 ~ 3.0E7
	landEndRadius = 1250.0
	#Continentalness the ocean past landEndRadius is pulled toward. -0.75 is deep ocean in vanilla and Terralith.
	#Do not go below -0.85: with Terralith, values under about -0.92 are its island zone and make land.
	# Default: -0.75
	# Range: -1.2 ~ 1.0
	oceanContinentalness = -0.75
	#How much of the normal continentalness still varies the ocean past landEndRadius (0 = flat target, 1 = no change).
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	oceanVariability = 0.15
	#Radius from which the Overworld is entirely the Pale biome.
	# Default: 1300.0
	# Range: 0.0 ~ 3.0E7
	paleBiomeRadius = 1300.0
	#How ragged the island's outline is: every radius here (and the fog wall's) is stretched or shrunk by up to
	#this share depending on the direction, in a pattern of lobes, bays and headlands that differs with the seed.
	#0 = a circle. Fixed for each world when it is created (saved in thepale-world.json); worlds from before
	#this setting stay round.
	# Default: 0.25
	# Range: 0.0 ~ 0.6
	coastRoughness = 0.25
	#New worlds get three islands: a mild starter island at (0, 0), a hot one 3500 to 4500 blocks south and a
	#frozen one as far north, each 1000 to 1500 blocks in radius, with the Pale between them. false = one island.
	#With three islands the radii in this file are measured from each island's coast: landEndRadius is the
	#coast itself, paleBiomeRadius 50 past it, and so on. Fixed for each world when it is created.
	threeIslands = true

[poison]
	#Radius where the poison starts (Overworld, survival and adventure only).
	# Default: 1500.0
	# Range: 0.0 ~ 3.0E7
	poisonStartRadius = 1500.0
	#Radius where the poison reaches full strength. Treated as poisonStartRadius + 1 if lower.
	# Default: 2000.0
	# Range: 0.0 ~ 3.0E7
	poisonFullRadius = 2000.0

[climate]
	#Cold north (-Z), hot south (+Z): how much the place on the island decides the temperature, from 0 (the seed
	#decides, as in vanilla) to 1 (only the place does). In between, the seed's noise still varies it locally.
	#The south-east ends up the hottest, so the wet south-west keeps its jungles. Negative swaps north and south.
	# Default: 0.7
	# Range: -1.0 ~ 1.0
	temperatureZones = 0.7
	#Wet west (-X), dry east (+X): how much the place on the island decides the humidity, 0 to 1 as above.
	#Negative swaps west and east.
	# Default: 0.6
	# Range: -1.0 ~ 1.0
	humidityZones = 0.6
	#Distance from (0, 0) at which the zones are at their extremes. Between there and the centre they change
	#evenly. Only affects newly generated chunks; already generated ones keep their biomes.
	# Default: 1000.0
	# Range: 1.0 ~ 3.0E7
	climateRadius = 1000.0

[structures]
	#Overworld structures normally spaced wider than this many chunks apart (woodland mansions: 80, Born in Chaos:
	#up to 200) are spaced this far apart instead, so they get a few tries on the island. Their biome rules stay.
	#0 leaves every structure as it is. Only affects newly generated chunks.
	# Default: 40
	# Range: 0 ~ 4096
	maxStructureSpacing = 40
	#When a new world is created with a random seed (the seed field left empty), try seeds until one puts every
	#structure in requiredStructures on the island, and use it. A seed you type in is kept; the mod only tells you
	#what's missing on it. Existing worlds are never touched.
	searchSeed = true
	#Structures the seed search wants on the island. One line per requirement; a line is met by any of the
	#structures in it, separated by |, and a name ending in * means every structure whose name starts with it
	#(minecraft:village_* = any village). Lines naming only structures from mods that aren't installed are
	#skipped. /thepale survey lists the structures your game has.
	requiredStructures = ["minecraft:village_*|terralith:fortified_*", "minecraft:desert_pyramid", "minecraft:jungle_pyramid", "minecraft:swamp_hut|terralith:witch_hut", "minecraft:igloo|terralith:igloo", "minecraft:mansion", "minecraft:monument", "minecraft:ancient_city", "minecraft:trial_chambers", "minecraft:pillager_outpost", "minecraft:trail_ruins", "born_in_chaos_v1:dark_tower_*", "born_in_chaos_v1:clown_caravan_*", "born_in_chaos_v1:observation_tower_*", "born_in_chaos_v1:farm", "born_in_chaos_v1:firewell", "born_in_chaos_v1:mound_of_hounds", "born_in_chaos_v1:infernal_pumpkin", "born_in_chaos_v1:grave*"]
	#How long the seed search may take before it settles for the seed that came closest.
	# Default: 60
	# Range: 1 ~ 3600
	maxSearchSeconds = 60
	#For a new world, whatever in requiredStructures still isn't on the island (with any seed, your own too) gets
	#one try of its structure set moved to a spot on the island where it fits: the right biome and workable
	#ground. A structure whose biome isn't on the island at all can't be placed. Saved with the world
	#(thepale-structure-pins.json).
	pinMissingStructures = true
	#Structures that generate only on the frozen northern island when the world has three islands; anywhere
	#else in the Overworld they don't start. Their own biome rules still apply on that island. The seed search
	#and the pins respect this. One structure id per line; * matches any run of characters
	#(born_in_chaos_v1:dark_tower_* = Born in Chaos's dark towers). Only affects newly generated chunks.
	frozenIslandOnlyStructures = ["born_in_chaos_v1:dark_tower_*"]
	#Structures that never start within villageClearance chunks of a village (of any set in villageStructureSets).
	#Vanilla keeps its pillager outposts away from its own villages only, so Terralith's fortified villages
	#got pillager towers in the middle. One structure id per line; * matches any run of characters.
	#Only affects newly generated chunks.
	keepAwayFromVillages = ["minecraft:pillager_outpost", "terralith:desert_outpost"]
	#Structure sets whose structures count as villages for keepAwayFromVillages (minecraft:villages = the
	#vanilla villages, terralith:rare_village = Terralith's fortified and fortified desert villages).
	villageStructureSets = ["minecraft:villages", "terralith:rare_village"]
	#How many chunks keepAwayFromVillages structures stay from the spot a village tries (in a square, as
	#vanilla's own 10 chunks between outposts and villages). 0 turns this off.
	# Default: 10
	# Range: 0 ~ 64
	villageClearance = 10

[ores]
	#Placed features (ores and the like) that generate only on the frozen northern island when the world has
	#three islands; on the starter and hot islands, and in the Pale nearest them, they are skipped. One feature
	#id per line; * matches any run of characters (oritech:ore_* = Oritech's nickel and platinum, oritech:uranium_*
	#= its uranium). The server log lists which features matched at start-up. Overworld only (the End keeps its
	#platinum). Only affects newly generated chunks; one-island worlds are untouched.
	frozenIslandOnlyFeatures = ["oritech:ore_*", "oritech:uranium_*", "create_new_age:thorium_ore"]
	#The same for the hot southern island: these placed features generate there and nowhere else in the
	#Overworld (oritech:oil_spring* = Oritech's oil springs). Same patterns as frozenIslandOnlyFeatures.
	#Create Diesel Generators' oil isn't a feature: The Pale limits it to desert, badlands and savanna biomes
	#through the createdieselgenerators:oil_biomes tag instead.
	hotIslandOnlyFeatures = ["oritech:oil_spring*"]

[mobs]
	#Hostile mobs that never appear on the starter island when the world has three islands: natural spawns,
	#spawners, mod events, all of them. Only hostile mobs (monster category) are stopped, and spawn eggs and
	#/summon still work. Mobs already in the world are left alone. One entity id per line; * matches any run
	#of characters (born_in_chaos_v1:* = every hostile mob from Born in Chaos); a line starting with ! is an exception
	#(the player's own summoned allies). The server log lists the matches.
	notOnStarterIsland = ["born_in_chaos_v1:*", "!born_in_chaos_v1:controlled_*", "!born_in_chaos_v1:*_controlled"]

[effects]
	#Movement speed bonus of Born in Chaos' Rampage, in percent, for its five levels from Light to Rampant
	#(Born in Chaos itself gives 15, 30, 50, 75, 100). Applies to every source of Rampage: the Great Reaper Axe,
	#the full Dark Metal set at low health and the potion. Damage and attack speed stay as Born in Chaos has them.
	#An effect already running keeps its old bonus until it ends.
	rampageSpeedBonus = [5.0, 10.0, 15.0, 20.0, 25.0]
	#Level of Strength a player gets while wearing all four pieces of Born in Chaos' Dark Metal armour
	#(1 = Strength I). 0 turns this off. Strength also keeps the Dark Warblade from making its wielder tired.
	# Default: 1
	# Range: 0 ~ 5
	darkMetalSetStrength = 1

[finale]
	#How many game days the boss takes to reach the shore once the invasion has started. Counted in game
	#time, so sleeping or /time add brings it closer. It comes ashore on the first night after that.
	# Default: 3.0
	# Range: 0.01 ~ 100.0
	approachDays = 3.0
	#How far out in the Pale the boss starts, in blocks from the shore it is heading for.
	# Default: 1800.0
	# Range: 200.0 ~ 10000.0
	approachStartDistance = 1800.0
	#After this many days of the approach its silhouette shows on the horizon (before that only the sky darkens).
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	silhouetteFromDay = 1.0
	#Once it has arrived it waits off the shore; it comes ashore at night when a player is within this
	#many blocks of the landing point.
	# Default: 96.0
	# Range: 16.0 ~ 512.0
	spawnRange = 96.0
	#Players within this many blocks of the landing point are in the fight: they see the boss bar and are counted for its health.
	# Default: 64.0
	# Range: 16.0 ~ 256.0
	arenaRadius = 64.0
	#How far the boss moves from the landing point. It never goes inland past this, so a base away from the shore is safe.
	# Default: 14.0
	# Range: 0.0 ~ 64.0
	bossLeash = 14.0
	#With no living player in the arena for this many minutes the boss goes back into the sea and returns the
	#next night at full health. The finale can't be lost.
	# Default: 3.0
	# Range: 0.1 ~ 60.0
	retreatMinutes = 3.0
	#Tell everybody the coordinates of the landing point when the boss arrives.
	announceCoordinates = true
	#Blocks around a tentacle's strike that are broken (0 = the boss breaks nothing; also needs the mobGriefing game rule).
	# Default: 0
	# Range: 0 ~ 4
	blockBreakRadius = 0

	#The Patchwork Abomination. Numbers are for a player in full netherite or Born in Chaos gear with Better Combat.
	[finale.boss]
		#Health of the body: the boss bar. The boss dies when it runs out.
		# Default: 600.0
		# Range: 1.0 ~ 100000.0
		bodyHealth = 600.0
		#Health of each of the six tentacles. At 0 the tentacle is severed.
		# Default: 50.0
		# Range: 1.0 ~ 100000.0
		tentacleHealth = 50.0
		#Health of the stone face on its tentacle.
		# Default: 100.0
		# Range: 1.0 ~ 100000.0
		faceHealth = 100.0
		#Health of the clawed hand on its tentacle.
		# Default: 100.0
		# Range: 1.0 ~ 100000.0
		handHealth = 100.0
		#Every player in the arena after the first adds this share to all of the boss's health (0.5 = +50% each).
		# Default: 0.5
		# Range: 0.0 ~ 10.0
		extraPlayerHealth = 0.5
		#Phases 1 and 2: share of a hit on the body that gets through while it still has tentacles.
		# Default: 0.2
		# Range: 0.0 ~ 1.0
		armoredDamageFactor = 0.2
		#Phase 3: share of a hit on the body that gets through while the main eye is shut.
		# Default: 0.1
		# Range: 0.0 ~ 1.0
		closedEyeDamageFactor = 0.1
		#Phase 3: a hit on the open main eye is multiplied by this.
		# Default: 1.5
		# Range: 0.0 ~ 10.0
		eyeDamageFactor = 1.5
		#Severing a tentacle, the face or the hand takes this share of the body's full health off the boss bar.
		# Default: 0.05
		# Range: 0.0 ~ 0.12
		severDamageFraction = 0.05
		#Phase 2 (the face and the hand come down and fight) starts when this many tentacles are left.
		# Default: 3
		# Range: 0 ~ 5
		phase2TentaclesLeft = 3
		#Phase 4 (the body falls and crawls, and takes full damage) starts at this share of its health.
		# Default: 0.25
		# Range: 0.01 ~ 0.6
		fallHealthFraction = 0.25
		#Damage of a tentacle's strike, before armour.
		# Default: 26.0
		# Range: 0.0 ~ 1000.0
		slamDamage = 26.0
		#Ticks the warning ring of particles shows on the ground before a tentacle strikes (20 = one second).
		# Default: 24
		# Range: 5 ~ 200
		slamWindupTicks = 24
		#Radius of a tentacle's strike, in blocks.
		# Default: 3.0
		# Range: 0.5 ~ 16.0
		slamRadius = 3.0
		#Ticks between strikes with all six tentacles alive. Fewer tentacles strike a little more often.
		# Default: 50
		# Range: 10 ~ 1200
		slamIntervalTicks = 50
		#Seconds between the face's spells (scream, summon, poison cloud, in turn).
		# Default: 9.0
		# Range: 2.0 ~ 600.0
		screamIntervalSeconds = 9.0
		#Mobs the face summons, one entity id per line, picked at random. Ids of mods that aren't installed are
		#skipped; if none is left, zombies come.
		summonMobs = ["born_in_chaos_v1:decaying_zombie", "born_in_chaos_v1:decrepit_skeleton", "born_in_chaos_v1:restless_spirit", "born_in_chaos_v1:dread_hound"]
		#How many mobs one summon brings.
		# Default: 3
		# Range: 0 ~ 32
		summonCount = 3
		#No more summons while this many summoned mobs are still alive.
		# Default: 9
		# Range: 0 ~ 128
		maxSummons = 9
		#How long a poison cloud stays (it gives the Pale's Wither and Hunger to players inside).
		# Default: 8.0
		# Range: 1.0 ~ 120.0
		poisonCloudSeconds = 8.0
		#Damage a second while the hand holds a player. Hitting the hand makes it let go.
		# Default: 5.0
		# Range: 0.0 ~ 1000.0
		grabDamage = 5.0
		#Phase 3: how long the main eye stays open.
		# Default: 8.0
		# Range: 1.0 ~ 120.0
		eyeOpenSeconds = 8.0
		#Phase 3: how long the main eye stays shut in between.
		# Default: 6.0
		# Range: 1.0 ~ 120.0
		eyeClosedSeconds = 6.0
		#Phase 4: damage of touching the crawling body, and of its shockwaves.
		# Default: 16.0
		# Range: 0.0 ~ 1000.0
		crawlDamage = 16.0
		#Experience the boss drops.
		# Default: 2500
		# Range: 0 ~ 1000000
		experience = 2500

	#The cleansing of the Pale, started by using the Heart of the Pale the boss drops.
	[finale.cleansing]
		#How long the fog wall, the fog, the grey water and the sea of clouds take to fade for players.
		# Default: 60.0
		# Range: 1.0 ~ 600.0
		fadeSeconds = 60.0
		#New chunks keep generating as open sea up to this many blocks past the farthest chunk that existed when
		#the Pale was cleansed, so old and new chunks never meet at a seam.
		# Default: 200.0
		# Range: 64.0 ~ 5000.0
		preserveMargin = 200.0
		#Past that margin the sea turns into the seed's normal terrain over this many blocks: new lands across the sea.
		# Default: 400.0
		# Range: 64.0 ~ 5000.0
		transitionWidth = 400.0
		#How many loaded chunks a tick have their Pale biome turned into ocean after the cleansing.
		# Default: 4
		# Range: 1 ~ 64
		chunksPerTick = 4
		#After the cleansing, Nether portals may open on the frozen island like anywhere else.
		openColdIslandPortals = true
		#The most blocks past the coasts the preserved sea may reach, 0 for no limit. Only for worlds where somebody
		#once generated chunks very far out: without a limit the new lands would start past those. Chunks that
		#exist beyond the limit keep their old sea and may meet new terrain at a visible seam.
		# Default: 0.0
		# Range: 0.0 ~ 1000000.0
		maxSeaDistance = 0.0
